<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO - 3D com Bots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <h1>Operação Web 3D</h1>
        <p><b>WASD</b>: Andar | <b>Mouse</b>: Mirar | <b>Clique</b>: Atirar</p>
        <button id="startBtn">JOGAR (Travar Mouse)</button> 
        <div id="score">Kills: 0</div>
    </div>

    <div id="crosshair"></div>
    
    <div id="gun"></div>

    <div id="camera">
        <div id="world">
            <div class="floor"></div>
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
