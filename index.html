<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO 2D Aim Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <h1>Aim Trainer - Operação JS</h1>

    <div id="gameArea"></div>

    <script src="script.js"></script>

</html>
