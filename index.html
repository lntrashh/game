<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Retro - Texturas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <h1>Modo Retro FPS</h1>
        <p><b>WASD</b>: Andar | <b>Mouse</b>: Mirar | <b>Clique</b>: Atirar</p>
        <button id="startBtn">JOGAR (Travar Mouse)</button> 
        <div id="score">Kills: 0</div>
    </div>

    <div id="crosshair"></div>
    
    <img id="gun" src="https://cdn.pixabay.com/photo/2013/07/12/13/44/assault-rifle-147173_960_720.png" alt="Arma">

    <div id="camera">
        <div id="world">
            <div class="floor"></div>
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
